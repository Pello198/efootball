<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Tournament Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="main-container" style="max-width: 600px; margin: 30px auto;">
        
        <!-- Tab Buttons -->
        <div class="profile-tabs" style="display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;">
            <button type="button" id="showLoginBtn" class="button primary-button" onclick="switchTab('login')">Login</button>
            <button type="button" id="showRegisterBtn" class="button secondary-button" onclick="switchTab('register')">Register</button>
        </div>

        <!-- LOGIN SECTION -->
        <section class="card" id="loginSection">
            <div class="section-header">
                <h2>User Login</h2>
            </div>
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div style="position: relative; display: flex;align-items: center; ">
                    <input type="password" id="loginPassword" placeholder="Enter your password" style ="padding-right: 150px;" required>
                    <button type="button" onclick="togglePassword('loginPassword', this)" 
                    style="position: absolute; right: 10px; background: none; border: none;
                    cursor: pointer; font-size: 0.85rem; color: #2563eb; font-weight: bold;">Show password</button>
                </div></div>
                <button type="submit" class="button primary-button" style="width: 100%;">Login</button>
            </form>
        </section>

        <!-- REGISTER SECTION -->
        <section class="card hidden" id="registerSection">
            <div class="section-header">
                <h2>Create Account</h2>
            </div>
            <form id="registerForm" class="form">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="regNumber">Phone Number (Whatsapp)</label>
                    <input type="text" id="regNumber" placeholder="Enter phone number">
                </div>
                <div class="form-group" style="margin-top: 15px;">
        <label for="regAvatar">Avatar / Profile Picture (Optional)</label>
        <input type="file" id="regAvatar" accept="image/*">
    </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                </div>
                <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" id="regConfirmPassword" placeholder="Confirm password" required 
                style="padding-right: 150px;">
                <button type="button" onclick="toggleBothPasswords('regConfirmPassword', this)"
                style="position: absolute; right: 10px; background: none; border: none; 
                cursor: pointer; font-size: 0.85rem; color: #2563eb; font-weight: bold;">Show password</button>
            </div>
        </div>
                <button type="submit" class="button primary-button" style="width: 100%;">Register</button>
            </form>
        </section>

        <div id="messageContainer" class="message-container"></div>
    </main>

    <script type="module" src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
